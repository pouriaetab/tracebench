name: V&V

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  vv:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: python -m tracebench.report
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vv-reports-py${{ matrix.python }}
          path: reports/
